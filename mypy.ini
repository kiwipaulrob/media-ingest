[mypy]
python_version = 3.12
files = media_lib/
ignore_missing_imports = True

# The point of this config is the remote-boundary contracts (probe.probe, qb.torrents):
# a consumer that reads a field the producer never returns should be a static error.
# It is deliberately NOT strict about untyped defs elsewhere, because the value is in the
# shapes, not in annotating every helper at once.
check_untyped_defs = True
disallow_untyped_defs = False
warn_unused_ignores = False
warn_redundant_casts = True
no_implicit_optional = True
show_error_codes = True
